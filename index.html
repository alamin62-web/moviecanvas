
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Streaming App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101010;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.phone {
    width: 300px;
    height: 610px;
    background: #050505;
    border: 6px solid #12bb79;
    border-radius: 39px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 30px #000;
}

.screen {
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding-bottom: 65px;
    background: #090b0d;
}

.screen::-webkit-scrollbar {
    display: none;
}

/* Status bar */

.status {
    height: 38px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    position: relative;
}

.notch {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 25px;
    background: #000;
    border-radius: 20px;
}

/* Search */

.search-area {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 12px;
}

.search {
    flex: 1;
    height: 27px;
    border: 1px solid #666;
    background: #111820;
    border-radius: 3px;
    color: white;
    padding: 0 10px;
    font-size: 10px;
}

.vip {
    font-size: 10px;
    white-space: nowrap;
    color: #e8d8a5;
}

/* Categories */

.categories {
    display: flex;
    justify-content: space-around;
    height: 35px;
    align-items: center;
    font-size: 10px;
    color: #ddd;
}

.categories span:first-child {
    border-bottom: 2px solid #13b77a;
    padding: 10px 13px;
}

/* Hero */

.hero {
    height: 235px;
    position: relative;
    background:
    linear-gradient(to top, #090b0d 0%, transparent 60%),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800")
    center 35% / cover;
}

.hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        #090b0d 0%,
        transparent 55%,
        rgba(0,0,0,.25) 100%
    );
}

.hero-info {
    position: absolute;
    bottom: 8px;
    left: 12px;
    z-index: 2;
}

.hero-info h3 {
    font-size: 11px;
    margin-bottom: 5px;
}

.hero-info p {
    font-size: 9px;
    color: #aaa;
}

.tagline {
    position: absolute;
    bottom: 15px;
    right: 12px;
    font-size: 8px;
    letter-spacing: 4px;
    color: #ddd;
    z-index: 2;
}

/* Trending */

.trending {
    padding: 12px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.section-heading h2 {
    font-size: 15px;
    font-weight: 500;
}

.section-heading a {
    color: #3fc78b;
    font-size: 9px;
    text-decoration: none;
}

.movies {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.movie-card {
    min-width: 0;
}

.poster {
    height: 122px;
    border-radius: 7px;
    overflow: hidden;
    position: relative;
    background-size: cover;
    background-position: center;
}

.poster::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(0,0,0,.45),
        transparent 55%
    );
}

.poster.one {
    background-image: url(
      "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=400"
    );
}

.poster.two {
    background-image: url(
      "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400"
    );
}

.poster.three {
    background-image: url(
      "https://images.unsplash.com/photo-1509248961158-e54f6934749c?w=400"
    );
}

.poster-label {
    position: absolute;
    z-index: 2;
    bottom: 12px;
    left: 5px;
    right: 3px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    text-shadow: 1px 2px 4px black;
}

.movie-info {
    padding-top: 6px;
}

.movie-info h4 {
    font-size: 9px;
    margin-bottom: 4px;
}

.movie-info p {
    font-size: 8px;
    color: #999;
}

/* Bottom Navigation */

.bottom-nav {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 55px;
    background: rgba(8, 12, 13, .97);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #202526;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: #999;
    font-size: 8px;
}

.nav-item .icon {
    font-size: 17px;
}

.nav-item.active {
    color: #19c982;
}

.nav-item.active .icon {
    background: #19c982;
    color: #07140e;
    border-radius: 50%;
    padding: 5px;
}

@media (min-width: 600px) {
    .phone {
        transform: scale(1.05);
    }
}
</style>
</head>

<body>

<div class="phone">
<div class="screen">

    <div class="status">
        <span>9:30</span>
        <div class="notch"></div>
        <span>● ▰ ▴</span>
    </div>

    <div class="search-area">
        <input class="search" placeholder="⌕  Search">
        <div class="vip">♛ VIP Access</div>
    </div>

    <div class="categories">
        <span>Action</span>
        <span>Classic</span>
        <span>Children</span>
        <span>Horror</span>
    </div>

    <section class="hero">
        <div class="hero-info">
            <h3>Road House</h3>
            <p>2024</p>
        </div>
        <div class="tagline">TAKE IT OUTSIDE</div>
    </section>

    <section class="trending">

        <div class="section-heading">
            <h2>Trending Now</h2>
            <a href="#">View All</a>
        </div>

        <div class="movies">

            <div class="movie-card">
                <div class="poster one">
                    <div class="poster-label">Freelance</div>
                </div>
                <div class="movie-info">
                    <h4>Freelance</h4>
                    <p>2023</p>
                </div>
            </div>

            <div class="movie-card">
                <div class="poster two">
                    <div class="poster-label">The Beekeeper</div>
                </div>
                <div class="movie-info">
                    <h4>The Beekeeper</h4>
                    <p>2024</p>
                </div>
            </div>

            <div class="movie-card">
                <div class="poster three">
                    <div class="poster-label">Silent Night</div>
                </div>
                <div class="movie-info">
                    <h4>Silent Night</h4>
                    <p>2023</p>
                </div>
            </div>

        </div>
    </section>

</div>

<div class="bottom-nav">
    <div class="nav-item active">
        <span class="icon">⌂</span>
        <span>Home</span>
    </div>

    <div class="nav-item">
        <span class="icon">⊙</span>
        <span>Explore</span>
    </div>

    <div class="nav-item">
        <span class="icon">▣</span>
        <span>Library</span>
    </div>

    <div class="nav-item">
        <span class="icon">♙</span>
        <span>Profile</span>
    </div>
</div>

</div>

</body>
</html>
