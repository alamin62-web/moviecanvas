
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieCanvas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:white;font-family:Arial,sans-serif}
header{background:#11151e;padding:18px 5%;border-bottom:1px solid #252b38}
.logo{font-size:27px;font-weight:900;color:#fff}
.logo span{color:#00d6a0}
nav{display:flex;gap:18px;margin-top:15px;flex-wrap:wrap}
nav a{color:#bbb;text-decoration:none;font-size:14px}
.search{width:100%;margin-top:18px;padding:14px;border:1px solid #343b49;border-radius:8px;background:#090b10;color:white;font-size:15px}
main{max-width:1200px;margin:auto;padding:20px}
.hero{background:linear-gradient(110deg,#172b36,#26304c,#15151f);padding:30px 22px;border-radius:12px;margin-bottom:25px}
.hero h1{font-size:30px;margin:0 0 10px}
.hero p{color:#c3c8d2}
h2{font-size:20px;border-left:4px solid #00d6a0;padding-left:12px}
.filters{display:flex;gap:9px;overflow-x:auto;padding:12px 0}
button{cursor:pointer}
.filters button{border:0;background:#202633;color:white;padding:10px 17px;border-radius:20px;white-space:nowrap}
.filters button.active{background:#00d6a0;color:#07110e}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{background:#151923;border-radius:10px;overflow:hidden;border:1px solid #252b38}
.poster{height:220px;display:flex;align-items:end;padding:14px;background:linear-gradient(145deg,var(--a),var(--b))}
.poster strong{font-size:23px;text-shadow:0 2px 8px black}
.info{padding:13px}
.info h3{margin:8px 0;font-size:16px}
.info p{color:#9ba4b5;font-size:12px}
.tag{background:#087d60;color:white;padding:5px 8px;border-radius:4px;font-size:10px}
.actions{display:flex;gap:7px;margin-top:12px}
.actions a{flex:1;text-align:center;padding:10px 4px;text-decoration:none;font-size:12px;font-weight:bold;border-radius:6px}
.watch{background:#00d6a0;color:#07110e}
.download{background:#30394a;color:white}
footer{text-align:center;color:#778091;padding:30px;font-size:12px}
.empty{text-align:center;color:#aaa;padding:35px;grid-column:1/-1}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:950px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
  <div class="logo">MOVIE<span>CANVAS</span></div>
  <nav>
    <a href="#">Home</a>
    <a href="#movies">Movies</a>
    <a href="#movies">Series</a>
    <a href="#footer">About</a>
  </nav>
  <input class="search" id="search" placeholder="Search movies or series...">
</header>

<main>
  <section class="hero">
    <h1>Discover Your Next Movie</h1>
    <p>Explore movies, series and entertainment in one place.</p>
  </section>

  <section id="movies">
    <h2>Recently Updated</h2>
    <div class="filters">
      <button class="active" onclick="filter('All',this)">All</button>
      <button onclick="filter('Movie',this)">Movies</button>
      <button onclick="filter('Series',this)">Series</button>
      <button onclick="filter('Action',this)">Action</button>
      <button onclick="filter('Drama',this)">Drama</button>
      <button onclick="filter('Sci-Fi',this)">Sci-Fi</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer id="footer">
  MovieCanvas © 2026 · Movie information and authorized links
</footer>

<script>
const movies=[
 {title:"Shadow Kingdom",type:"Movie",genre:"Action",year:"2026",a:"#70352e",b:"#171b36",watch:"",download:""},
 {title:"Beyond The Stars",type:"Movie",genre:"Sci-Fi",year:"2026",a:"#254d76",b:"#19152e",watch:"",download:""},
 {title:"Silent Promise",type:"Series",genre:"Drama",year:"2025",a:"#79465f",b:"#25213b",watch:"",download:""},
 {title:"Dark Horizon",type:"Movie",genre:"Action",year:"2025",a:"#47534c",b:"#151b25",watch:"",download:""},
 {title:"Lost Universe",type:"Series",genre:"Sci-Fi",year:"2026",a:"#354b83",b:"#251a3b",watch:"",download:""},
 {title:"The Last Letter",type:"Movie",genre:"Drama",year:"2025",a:"#805c39",b:"#291e31",watch:"",download:""}
];

let selected="All";

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=movies.filter(m=>
 (selected==="All"||m.type===selected||m.genre===selected)&&
 m.title.toLowerCase().includes(q)
 );

 document.getElementById("grid").innerHTML=list.length?list.map((m)=>{
 const watch=m.watch ? `<a class="watch" href="${m.watch}" target="_blank" rel="noopener">WATCH NOW</a>` : `<a class="watch" href="#" onclick="missing(event)">WATCH NOW</a>`;
 const download=m.download ? `<a class="download" href="${m.download}" target="_blank" rel="noopener">DOWNLOAD</a>` : `<a class="download" href="#" onclick="missing(event)">DOWNLOAD</a>`;
 return `
 <article class="card">
  <div class="poster" style="--a:${m.a};--b:${m.b}">
   <strong>${m.title.toUpperCase()}</strong>
  </div>
  <div class="info">
   <span class="tag">${m.genre}</span>
   <h3>${m.title}</h3>
   <p>${m.type} · ${m.year}</p>
   <div class="actions">${watch}${download}</div>
  </div>
 </article>`;
 }).join(""):'<div class="empty">No movies found.</div>';
}

function filter(f,b){
 selected=f;
 document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 render();
}

function missing(e){
 e.preventDefault();
 alert("An authorized video link has not been added yet.");
}

document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
