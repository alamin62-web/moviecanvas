<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MovieCanvas</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17191e;color:white;font-family:Arial,sans-serif}
header{background:#242830;padding:18px;border-bottom:3px solid #00c58a}
.logo{font-size:25px;font-weight:900}
.logo span{color:#00c58a}
input{width:100%;padding:13px;border-radius:25px;margin-top:15px;background:#111318;color:white;border:1px solid #444}
main{padding:15px;max-width:1100px;margin:auto}
h2{border-left:5px solid #00c58a;padding-left:12px;font-size:20px}
.filters{display:flex;gap:8px;overflow:auto;margin:15px 0}
button{padding:9px 14px;border:0;border-radius:20px;background:#303640;color:white;white-space:nowrap}
button.active{background:#00c58a;color:#111}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#08090b;border-radius:9px;overflow:hidden}
.poster{height:230px;display:flex;align-items:end;padding:13px;background:linear-gradient(140deg,var(--a),var(--b))}
.poster strong{font-size:27px;text-shadow:0 2px 8px black}
.info{padding:12px}
.info h3{font-size:15px}
.info p{font-size:12px;color:#aaa}
.tag{font-size:10px;background:#078b36;padding:5px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">MOVIE<span>CANVAS</span></div>
<input id="search" placeholder="Search movies or series...">
</header>
<main>
<h2>RECENTLY UPDATED</h2>
<div class="filters">
<button class="active" onclick="filter('All',this)">All</button>
<button onclick="filter('Movie',this)">Movies</button>
<button onclick="filter('Series',this)">Series</button>
<button onclick="filter('Hindi',this)">Hindi</button>
<button onclick="filter('English',this)">English</button>
<button onclick="filter('Korean',this)">Korean</button>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const movies=[
["Ramayana: Rise of a Legend","Movie","Hindi","#a84c22","#171c30"],
["The Remarried Empress","Series","Korean","#722b51","#171d30"],
["Black Doves","Series","English","#56616b","#202a34"],
["Bigg Boss","Series","Hindi","#6a3820","#221a39"],
["The Last Kingdom","Series","English","#394a3e","#151b25"],
["Moonlit Promise","Movie","Korean","#283f69","#29213c"]
];
let selected="All";
function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("grid").innerHTML=movies.filter(m=>
(selected==="All"||m[1]===selected||m[2]===selected)&&
m[0].toLowerCase().includes(q)
).map(m=>`
<div class="card">
<div class="poster" style="--a:${m[3]};--b:${m[4]}">
<strong>${m[0].toUpperCase()}</strong>
</div>
<div class="info">
<span class="tag">${m[2]}</span>
<h3>${m[0]}</h3>
<p>${m[1]} · Movie information</p>
</div></div>`).join("");
}
function filter(f,b){
selected=f;
document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
